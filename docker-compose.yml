services:
  postgres:
    image: postgres:16-alpine
    container_name: koi-market-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koipassword}
      POSTGRES_DB: ${POSTGRES_DB:-koi_market}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koiuser} -d ${POSTGRES_DB:-koi_market}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: koi-market-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-koiuser}:${POSTGRES_PASSWORD:-koipassword}@postgres:5432/${POSTGRES_DB:-koi_market}
      ENVIRONMENT: development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
